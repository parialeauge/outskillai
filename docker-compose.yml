services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.combined
    image: pactlify:0.6.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ALLOWED_INGEST_ROOT: /app
      CORS_ORIGIN: http://localhost:8000
      STATIC_DIR: /app/ui
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
