services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: pactlify-backend:0.6.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ALLOWED_INGEST_ROOT: /app
      CORS_ORIGIN: http://localhost:5173,http://localhost:8000
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
