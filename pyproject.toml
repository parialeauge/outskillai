[project]
name = "pactlify"
version = "0.6.0"
requires-python = ">=3.11"
# Pins must match requirements.txt. Docker installs requirements.txt then
# `pip install --no-deps -e .` so this file cannot re-resolve versions.
dependencies = [
  "fastapi==0.141.1",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.30.5",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "torch==2.2.2",
  "transformers==4.46.3",
  "lancedb==0.25.3",
  "sentence-transformers==3.4.1",
  "langgraph==1.2.11",
  "httpx==0.28.1",
  "pymupdf==1.28.2",
  "python-dotenv==1.2.3",
  "pydantic==2.13.4",
  "tavily-python==0.8.1",
  "weasyprint==69.0",
  "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "backend*", "shared*"]

